name: Chrome Web Store

on:
  workflow_dispatch:
    inputs:
      version:
        description: Required except for status-only; must match public/manifest.json
        required: false
        type: string
      publish_mode:
        description: Check status, upload only, or submit after a successful upload
        required: true
        default: status-only
        type: choice
        options:
          - status-only
          - upload-only
          - staged
          - automatic

permissions:
  contents: read
  id-token: write

concurrency:
  group: chrome-web-store
  cancel-in-progress: false

jobs:
  publish:
    name: Check, upload, or submit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: chrome-web-store
    env:
      CWS_EXTENSION_ID: ${{ vars.CWS_EXTENSION_ID }}
      CWS_PUBLISHER_ID: ${{ vars.CWS_PUBLISHER_ID }}
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      GCP_SERVICE_ACCOUNT: ${{ vars.GCP_SERVICE_ACCOUNT }}
      GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}

    steps:
      - name: Validate request and configuration
        shell: bash
        env:
          EXPECTED_VERSION: ${{ inputs.version }}
          PUBLISH_MODE: ${{ inputs.publish_mode }}
        run: |
          set -euo pipefail

          if [[ "$GITHUB_REF" != "refs/heads/master" ]]; then
            echo "This workflow may run only from master; selected ref: $GITHUB_REF" >&2
            exit 1
          fi

          for name in \
            CWS_EXTENSION_ID \
            CWS_PUBLISHER_ID \
            GCP_PROJECT_ID \
            GCP_SERVICE_ACCOUNT \
            GCP_WORKLOAD_IDENTITY_PROVIDER; do
            if [[ -z "${!name:-}" ]]; then
              echo "Missing required GitHub Actions variable: $name" >&2
              exit 1
            fi
          done

          if [[ "$PUBLISH_MODE" != "status-only" && -z "$EXPECTED_VERSION" ]]; then
            echo 'A version is required for upload and publish modes.' >&2
            exit 1
          fi

      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.18.0
          cache: npm

      - name: Validate configuration and version
        if: inputs.publish_mode != 'status-only'
        id: package
        shell: bash
        env:
          EXPECTED_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          version="$(node -p "require('./public/manifest.json').version")"
          if [[ "$version" != "$EXPECTED_VERSION" ]]; then
            echo "Requested version $EXPECTED_VERSION does not match public/manifest.json ($version)." >&2
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "archive=$RUNNER_TEMP/multi-ai-chat-store-v${version}.zip" >> "$GITHUB_OUTPUT"

      - name: Check Google Cloud authentication
        id: preflight_auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_SERVICE_ACCOUNT }}
          project_id: ${{ env.GCP_PROJECT_ID }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/chromewebstore
          access_token_lifetime: 900s
          create_credentials_file: false
          export_environment_variables: false

      - name: Check publisher access and upload eligibility
        id: preflight
        shell: bash
        env:
          ACCESS_TOKEN: ${{ steps.preflight_auth.outputs.access_token }}
          EXPECTED_VERSION: ${{ inputs.version }}
          PUBLISH_MODE: ${{ inputs.publish_mode }}
        run: bash scripts/chrome-web-store.sh --preflight

      - name: Install dependencies
        if: inputs.publish_mode != 'status-only'
        run: npm ci

      - name: Audit dependencies
        if: inputs.publish_mode != 'status-only'
        run: npm audit --audit-level=high

      - name: Verify source and production build
        if: inputs.publish_mode != 'status-only'
        run: npm run verify

      - name: Confirm committed build is current
        if: inputs.publish_mode != 'status-only'
        shell: bash
        run: |
          set -euo pipefail
          changes="$(git status --porcelain --untracked-files=all -- dist)"
          if [[ -n "$changes" ]]; then
            printf '%s\n' "$changes" >&2
            exit 1
          fi

      - name: Package extension
        if: inputs.publish_mode != 'status-only'
        id: bundle
        shell: bash
        env:
          ARCHIVE: ${{ steps.package.outputs.archive }}
        run: |
          set -euo pipefail
          python3 scripts/package-extension.py --output "$ARCHIVE"
          unzip -l "$ARCHIVE"
          unzip -p "$ARCHIVE" manifest.json | jq -e \
            --arg version "${{ steps.package.outputs.version }}" \
            '.version == $version' >/dev/null
          sha256="$(sha256sum "$ARCHIVE" | awk '{print $1}')"
          printf '%s  %s\n' "$sha256" "$(basename "$ARCHIVE")" > "${ARCHIVE}.sha256"
          echo "sha256=$sha256" >> "$GITHUB_OUTPUT"

      - name: Upload package artifact
        if: inputs.publish_mode != 'status-only'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: multi-ai-chat-store-v${{ steps.package.outputs.version }}
          path: |
            ${{ steps.package.outputs.archive }}
            ${{ steps.package.outputs.archive }}.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Refresh Google Cloud authentication before upload
        if: inputs.publish_mode != 'status-only'
        id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_SERVICE_ACCOUNT }}
          project_id: ${{ env.GCP_PROJECT_ID }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/chromewebstore
          access_token_lifetime: 900s
          create_credentials_file: false
          export_environment_variables: false

      - name: Upload to Chrome Web Store
        if: inputs.publish_mode != 'status-only'
        id: cws
        shell: bash
        env:
          ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
          ARCHIVE: ${{ steps.package.outputs.archive }}
          EXPECTED_VERSION: ${{ steps.package.outputs.version }}
          PUBLISH_MODE: ${{ inputs.publish_mode }}
        run: bash scripts/chrome-web-store.sh

      - name: Summarize result
        if: always()
        shell: bash
        env:
          JOB_STATUS: ${{ job.status }}
          PREFLIGHT_AUTH_OUTCOME: ${{ steps.preflight_auth.outcome }}
          PREFLIGHT_OUTCOME: ${{ steps.preflight.outcome }}
          AUTH_OUTCOME: ${{ steps.auth.outcome }}
          MODE: ${{ inputs.publish_mode }}
          PUBLISH_STATE: ${{ steps.cws.outputs.publish_state || steps.preflight.outputs.publish_state }}
          SHA256: ${{ steps.bundle.outputs.sha256 }}
          UPLOAD_STATE: ${{ steps.cws.outputs.upload_state }}
          VERSION: ${{ steps.package.outputs.version }}
        run: |
          {
            echo '## Chrome Web Store result'
            echo
            echo "- Workflow result: \`$JOB_STATUS\`"
            echo "- Google authentication preflight: \`$PREFLIGHT_AUTH_OUTCOME\`"
            echo "- Publisher access and eligibility: \`$PREFLIGHT_OUTCOME\`"
            echo "- Authentication before upload: \`$AUTH_OUTCOME\`"
            if [[ -n "$VERSION" ]]; then
              echo "- Version: \`$VERSION\`"
              echo "- SHA-256: \`$SHA256\`"
            fi
            echo "- Upload: \`${UPLOAD_STATE:-not-run}\`"
            echo "- Mode: \`$MODE\`"
            echo "- Store state: \`${PUBLISH_STATE:-not-queried}\`"
            if [[ "$PREFLIGHT_AUTH_OUTCOME" == "failure" || "$AUTH_OUTCOME" == "failure" ]]; then
              echo
              echo 'No upload or submission occurred. Check the configured Google Cloud project, workload identity pool/provider, and service-account access.'
              echo 'Recovery instructions: https://github.com/TED-H-com/multi-ai-chat/blob/master/store/PUBLISHING-RECOVERY.md'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
